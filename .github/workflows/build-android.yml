name: Android (experimental)

# LeviLaunchroid (Android 9+ ARM64) loads native .so client mods. LeviLamina
# has no OFFICIAL Android target yet, so this lane is best-effort: it
# cross-compiles the mod with the NDK toolchain for arm64-v8a and publishes
# the .so for sideloading into LeviLaunchroid's mods/ directory.
# See docs/ANDROID_PORT.md for the full story.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (android arm64 client)
        run: |
          xmake f -y -a arm64-v8a -p android --ndk=$ANDROID_NDK_HOME \
            -m release --target_type=client --android=y

      - name: Build
        run: xmake -y

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaylandCraftBE-android-arm64-client
          path: bin/*
          if-no-files-found: warn
