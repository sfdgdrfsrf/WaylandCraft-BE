name: Android (experimental)

# LeviLaunchroid (Android 9+ ARM64) loads native .so mods via its
# preloader-android runtime (PLGetModRegistration / pl::mod SDK). LeviLamina
# itself has NO Android target (client = windows|x64 only), so this lane does
# NOT use xmake/levilamina at all: it cross-compiles the pure-POSIX core
# (Wayland compositor + Android bridge + WLCF capture service) with the NDK
# through android-mod/CMakeLists.txt. See android-mod/src/AndroidMod.cpp and
# docs/ANDROID_PORT.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      # cmake + ninja are preinstalled on ubuntu-latest runners.

      - name: Build + package
        run: ./android-mod/package.sh android-mod/dist/WaylandCraftBE-android-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaylandCraftBE-android-arm64-client
          path: android-mod/dist/WaylandCraftBE-android-arm64.zip
          if-no-files-found: error

      # Tag builds: attach the .so (packed) to the GitHub Release itself so
      # LeviLaunchroid users can grab it without digging through Actions
      # artifacts. Dispatch/manual runs keep the artifact-only upload above.
      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-mod/dist/WaylandCraftBE-android-arm64.zip
