name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # LeviLamina 26.20 officially builds on Windows only — its own CI is
        # windows-latest and its symbolprovider dependency is Windows-only
        # (PE delay-load hooks). The Linux *compositor core* is still fully
        # exercised by the smoke-test job below, which needs no packages.
        # See docs/PORT_NOTES.md ("Windows build layer").
        os: [windows-latest]
        target_type: [server, client]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.target_type }}

    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache
          package-cache: true
          package-cache-key: wlc-${{ matrix.os }}-${{ matrix.target_type }}-v2

      - name: Configure
        run: |
          xmake f -y -a ${{ startsWith(matrix.os, 'windows') && 'x64' || 'x86_64' }} -m release --target_type=${{ matrix.target_type }}

      - name: Build
        run: xmake -y

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaylandCraftBE-${{ matrix.os }}-${{ matrix.target_type }}
          path: bin/*
          if-no-files-found: error

  # The Wayland smoke test proves the custom compositor speaks the real wire
  # protocol (registry/bind/shm/xdg-shell/frame callbacks). Pure POSIX C++ —
  # no LeviLamina headers, no packages, runs anywhere.
  smoke-test:
    runs-on: ubuntu-latest
    name: Wayland protocol smoke test
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          g++ -std=c++20 -Isrc -o /tmp/smoke tests/smoke_client.cpp \
              src/compositor/*.cpp src/util/Log.cpp src/util/MemFd.cpp \
              src/util/XkbKeymap.cpp -lpthread

      - name: Run
        run: timeout 60 /tmp/smoke
